#  trigger Test-2
name: Jenkins Migration CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: migration-pipeline-reg
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build-test-push:

    name: Build, Test and Push

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22


      - name: Install dependencies
        run: npm install


      - name: Run tests
        run: npm test


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsMigrationRole
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          echo "Building Docker image..."

          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .


      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |
          echo "Pushing Docker image..."

          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  deploy:

    name: Deploy to Application EC2

    needs: build-test-push

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsMigrationRole
          aws-region: ${{ env.AWS_REGION }}


      - name: Deploy using AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

        run: |

          echo "Deploying to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",
              \"docker stop app || true\",
              \"docker rm app || true\",
              \"docker run -d --name app -p 8082:8080 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment completed."


      - name: Smoke test
        env:
          EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}

        run: |

          echo "Running application health check..."

          sleep 5

          curl --fail \
            http://$EC2_PUBLIC_IP:8082/health

          echo ""
          echo "Smoke test passed!"
